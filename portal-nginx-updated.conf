server {

    root /var/www/precise;
    index index.html;
    server_name lab.harmonaize.uk _;

    location / {
        try_files $uri $uri/ =404;
    }

    # PRECISE DuckDB Access Request — test access service
    location /duckrequest/ {
        proxy_pass http://127.0.0.1:35488/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # PRECISE DuckDB REST API — exposed for external notebook access
    location /precise-api/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Database Access Request — token provisioning service
    location /dbrequest/ {
        proxy_pass http://127.0.0.1:35487/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_buffering       off;
    }

    location /data/ {
        alias /var/www/precise/data/;
        autoindex off;
    }

    location /catalogue/ {
        alias /var/www/precise/catalogue/;
        try_files $uri $uri/ /catalogue/index.html;
    }

    location /catalogue-request/ {
        proxy_pass http://127.0.0.1:8110/catalogue-request;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }

    # APEX-T — Air Pollution Exposure Trajectory Analyzer
    location /apex/ {
        rewrite ^/apex/(.*)$ /$1 break;
        proxy_pass http://192.168.1.254:8086;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location /dashboard/ {
        proxy_pass http://127.0.0.1:8502/dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    location /palsearth/ {
        proxy_pass http://127.0.0.1:8503/palsearth/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # NeoHeat — Neonatal Heat Risk Intelligence
    location /neoheat/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }

    # HarmonAIze — Climate & Health Data Harmonisation (Django, Docker port 8080)
    location /harmonaize/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lab.harmonaize.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lab.harmonaize.uk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = lab.harmonaize.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 196.44.191.98:80 default_server;
    server_name lab.harmonaize.uk _;
    return 404; # managed by Certbot
}
