<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shared Conversation — Shmron</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="/shared-charts.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f0f4f8;min-height:100vh;padding:24px 16px}
.page{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.header{background:white;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:20px 28px;display:flex;align-items:center;gap:14px}
.avatar{width:40px;height:40px;border-radius:50%;background:#1a535c;color:white;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.avatar.he2at{background:#9d0208}
.title{font-size:1rem;font-weight:700;color:#1a535c}
.title.he2at{color:#9d0208}
.sub{font-size:.75rem;color:#9ca3af;margin-top:2px}
.badge{display:inline-block;background:#f0fdf4;border:1px solid #a7f3d0;color:#065f46;font-size:.7rem;padding:2px 8px;border-radius:20px;margin-left:8px}
.msg-user{background:#1a535c;color:white;border-radius:12px 12px 4px 12px;padding:12px 16px;font-size:.9rem;line-height:1.55;align-self:flex-end;max-width:80%;margin-left:auto}
.msg-user.he2at{background:#9d0208}
.msg-ai{background:white;border-radius:12px 12px 12px 4px;padding:14px 18px;font-size:.9rem;line-height:1.6;box-shadow:0 2px 8px rgba(0,0,0,.07);max-width:100%}
.msg-ai strong{font-weight:600}
.msg-ai em{font-style:italic}
.msg-ai code{background:#f1f5f9;padding:.1rem .35rem;border-radius:4px;font-family:monospace;font-size:.82rem}
.chart-wrap{background:white;border-radius:10px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-top:10px}
.stats-wrap{background:white;border-radius:10px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-top:10px;font-size:.85rem}
.stats-title{font-weight:700;color:#1a535c;margin-bottom:4px}
.stats-meta{color:#6b7280;font-size:.78rem;margin-bottom:10px}
.stats-table{width:100%;border-collapse:collapse;font-size:.82rem}
.stats-table th{text-align:left;padding:6px 8px;background:#f8fafc;border-bottom:2px solid #e2e8f0;color:#374151;font-weight:600}
.stats-table td{padding:6px 8px;border-bottom:1px solid #f1f5f9;color:#374151}
.stars{color:#d97706;font-weight:700}
.msgs{display:flex;flex-direction:column;gap:14px}
.err{background:white;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:36px 28px;text-align:center;color:#991b1b}
.footer{text-align:center;font-size:.78rem;color:#9ca3af;padding-bottom:16px}
.footer a{color:#1a535c;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="page" id="app">
  <div style="text-align:center;color:#9ca3af;padding:40px">Loading…</div>
</div>

<script>
(async function() {
    const params   = new URLSearchParams(window.location.search);
    const shareId  = params.get('id');
    const app      = document.getElementById('app');

    if (!shareId) {
        app.innerHTML = '<div class="err"><h3>No share ID provided</h3><p style="margin-top:8px">Check the link and try again.</p></div>';
        return;
    }

    let conv;
    try {
        const r = await fetch('/precise-api/api/share/' + shareId);
        if (!r.ok) throw new Error('Not found');
        conv = await r.json();
    } catch(e) {
        app.innerHTML = '<div class="err"><h3>Conversation not found</h3><p style="margin-top:8px">This link may be invalid or expired.</p></div>';
        return;
    }

    const isHe2at  = conv.catalogue === 'he2at';
    const label    = isHe2at ? 'HE²AT Shmron' : 'PRECISE Shmron';
    const avatarTx = isHe2at ? 'H²' : '🤖';
    const cls      = isHe2at ? 'he2at' : '';
    const date     = new Date(conv.created_at).toLocaleDateString(undefined, {year:'numeric',month:'short',day:'numeric'});

    document.title = (conv.title || 'Shared conversation') + ' — Shmron';

    let chartSeq = 0;

    function escHtml(t) { return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function md(t) {
        return String(t||'')
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
            .replace(/\*(.+?)\*/g,'<em>$1</em>')
            .replace(/`(.+?)`/g,'<code>$1</code>')
            .replace(/\n/g,'<br>');
    }

    function renderStatsTable(res) {
        const rows = (res.coefficients||[]).filter(c=>c.variable!=='Intercept');
        return `<div class="stats-wrap">
            <div class="stats-title">${escHtml(res.title||'Regression')}</div>
            <div class="stats-meta">${res.model_type} | N=${(res.n_obs||0).toLocaleString()} | ${res.r_squared!==undefined?'R²='+res.r_squared:'Pseudo-R²='+res.pseudo_r_squared} | AIC=${res.aic}</div>
            <table class="stats-table">
              <thead><tr><th>Variable</th><th>Coef</th><th>95% CI</th><th>p</th><th></th></tr></thead>
              <tbody>${rows.map(c=>`<tr>
                <td>${escHtml(c.variable)}</td>
                <td>${c.coef.toFixed(4)}</td>
                <td>[${c.ci_lower.toFixed(3)}, ${c.ci_upper.toFixed(3)}]</td>
                <td>${c.p_value<0.001?'<0.001':c.p_value.toFixed(3)}</td>
                <td class="stars">${c.stars||''}</td>
              </tr>`).join('')}</tbody>
            </table></div>`;
    }

    let html = `
    <div class="header">
      <div class="avatar ${cls}">${avatarTx}</div>
      <div>
        <div class="title ${cls}">${label} <span class="badge">Shared</span></div>
        <div class="sub">${escHtml(conv.title||'Conversation')} &middot; ${date}</div>
      </div>
    </div>
    <div class="msgs" id="msgs">`;

    const pendingCharts = [];

    for (const m of (conv.messages||[])) {
        if (m.role === 'user') {
            html += `<div class="msg-user ${cls}">${md(m.content)}</div>`;
        } else if (m.role === 'assistant') {
            html += `<div class="msg-ai">${md(m.content)}`;
            for (const spec of (m.charts||[])) {
                const id = 'sc-' + (++chartSeq);
                const h  = spec.chart_type==='map' ? 440 : spec.chart_type==='heatmap' ? 400
                         : spec.chart_type==='forest' ? Math.max(300,((spec.forest_data||[]).length*36)+80) : 320;
                html += `<div class="chart-wrap"><div id="${id}" style="width:100%;height:${h}px"></div></div>`;
                pendingCharts.push({id, spec});
            }
            for (const t of (m.tables||[])) {
                html += renderStatsTable(t);
            }
            html += `</div>`;
        }
    }

    html += `</div>
    <div class="footer">Shared from <a href="/">placealert.org</a> &middot; Read-only view</div>`;

    app.innerHTML = html;

    /* Render charts after DOM is ready */
    requestAnimationFrame(() => {
        for (const {id, spec} of pendingCharts) {
            if (typeof window.PALsRenderChart === 'function') {
                window.PALsRenderChart(id, spec);
            }
        }
    });
})();
</script>
</body>
</html>
