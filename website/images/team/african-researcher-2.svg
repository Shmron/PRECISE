<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skinGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a876;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a67c52;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shirtGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="300" fill="#f8fafc"/>
  
  <!-- Person silhouette -->
  <circle cx="150" cy="100" r="40" fill="url(#skinGradient2)"/>
  <ellipse cx="150" cy="200" rx="60" ry="80" fill="url(#shirtGradient2)"/>
  
  <!-- Lab coat -->
  <rect x="120" y="180" width="60" height="100" fill="white" opacity="0.9"/>
  <rect x="130" y="190" width="40" height="80" fill="url(#shirtGradient2)" opacity="0.3"/>
  
  <!-- Glasses -->
  <circle cx="135" cy="95" r="12" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="165" cy="95" r="12" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="147" y1="95" x2="153" y2="95" stroke="#333" stroke-width="2"/>
  
  <!-- Laptop -->
  <rect x="100" y="220" width="40" height="25" fill="#374151" rx="2"/>
  <rect x="105" y="225" width="30" height="15" fill="#10b981" opacity="0.8"/>
  
  <!-- Research elements -->
  <rect x="50" y="50" width="20" height="20" fill="#3b82f6" opacity="0.7"/>
  <rect x="230" y="60" width="20" height="20" fill="#f59e0b" opacity="0.7"/>
  <circle cx="80" cy="250" r="15" fill="#ef4444" opacity="0.7"/>
  <circle cx="220" cy="240" r="15" fill="#8b5cf6" opacity="0.7"/>
  
  <!-- Text -->
  <text x="150" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">Data Scientist</text>
</svg>





