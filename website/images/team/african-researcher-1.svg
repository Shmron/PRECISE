<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8946f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shirtGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="300" fill="#f8fafc"/>
  
  <!-- Person silhouette -->
  <circle cx="150" cy="100" r="40" fill="url(#skinGradient)"/>
  <ellipse cx="150" cy="200" rx="60" ry="80" fill="url(#shirtGradient)"/>
  
  <!-- Lab coat -->
  <rect x="120" y="180" width="60" height="100" fill="white" opacity="0.9"/>
  <rect x="130" y="190" width="40" height="80" fill="url(#shirtGradient)" opacity="0.3"/>
  
  <!-- Stethoscope -->
  <path d="M 100 120 Q 120 140 140 160 Q 160 140 180 120" stroke="#333" stroke-width="3" fill="none"/>
  <circle cx="100" cy="120" r="8" fill="#333"/>
  <circle cx="180" cy="120" r="8" fill="#333"/>
  
  <!-- Research elements -->
  <rect x="50" y="50" width="20" height="20" fill="#10b981" opacity="0.7"/>
  <rect x="230" y="60" width="20" height="20" fill="#f59e0b" opacity="0.7"/>
  <circle cx="80" cy="250" r="15" fill="#ef4444" opacity="0.7"/>
  <circle cx="220" cy="240" r="15" fill="#8b5cf6" opacity="0.7"/>
  
  <!-- Text -->
  <text x="150" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">African Researcher</text>
</svg>





