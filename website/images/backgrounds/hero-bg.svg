<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.4" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#heroGradient)"/>
  <rect width="100%" height="100%" fill="url(#gridPattern)"/>
  <!-- Abstract shapes representing data visualization -->
  <circle cx="200" cy="200" r="80" fill="rgba(255,255,255,0.1)"/>
  <circle cx="800" cy="300" r="120" fill="rgba(255,255,255,0.05)"/>
  <circle cx="1400" cy="150" r="60" fill="rgba(255,255,255,0.08)"/>
  <circle cx="1600" cy="400" r="100" fill="rgba(255,255,255,0.06)"/>
  <circle cx="300" cy="600" r="90" fill="rgba(255,255,255,0.04)"/>
  <circle cx="1200" cy="700" r="70" fill="rgba(255,255,255,0.07)"/>
  <circle cx="1700" cy="800" r="110" fill="rgba(255,255,255,0.05)"/>
</svg>





