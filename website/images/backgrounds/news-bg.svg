<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="newsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#ef4444;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#f87171;stop-opacity:0.1" />
    </linearGradient>
    <pattern id="newsPattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect x="10" y="10" width="30" height="20" rx="3" fill="rgba(255,255,255,0.1)"/>
      <line x1="15" y1="15" x2="35" y2="15" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <line x1="15" y1="20" x2="30" y2="20" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#newsGradient)"/>
  <rect width="100%" height="100%" fill="url(#newsPattern)"/>
  <!-- News and communication elements -->
  <rect x="100" y="100" width="200" height="120" rx="10" fill="rgba(255,255,255,0.1)"/>
  <rect x="350" y="150" width="180" height="100" rx="8" fill="rgba(255,255,255,0.08)"/>
  <rect x="600" y="120" width="160" height="110" rx="12" fill="rgba(255,255,255,0.12)"/>
  <rect x="850" y="180" width="190" height="90" rx="9" fill="rgba(255,255,255,0.09)"/>
  <rect x="1100" y="140" width="170" height="105" rx="11" fill="rgba(255,255,255,0.11)"/>
  <rect x="1350" y="200" width="150" height="85" rx="7" fill="rgba(255,255,255,0.07)"/>
  <rect x="1600" y="130" width="180" height="95" rx="13" fill="rgba(255,255,255,0.13)"/>
  <rect x="1800" y="170" width="160" height="80" rx="10" fill="rgba(255,255,255,0.06)"/>
</svg>





