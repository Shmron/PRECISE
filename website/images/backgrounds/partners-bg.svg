<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="partnersGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.1" />
    </linearGradient>
    <pattern id="collaborationPattern" width="100" height="100" patternUnits="userSpaceOnUse">
      <polygon points="50,10 70,40 50,70 30,40" fill="rgba(255,255,255,0.08)"/>
      <circle cx="50" cy="50" r="20" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#partnersGradient)"/>
  <rect width="100%" height="100%" fill="url(#collaborationPattern)"/>
  <!-- Partnership connection elements -->
  <rect x="150" y="150" width="120" height="80" rx="15" fill="rgba(255,255,255,0.1)"/>
  <rect x="350" y="200" width="100" height="70" rx="12" fill="rgba(255,255,255,0.08)"/>
  <rect x="550" y="120" width="130" height="90" rx="18" fill="rgba(255,255,255,0.12)"/>
  <rect x="750" y="250" width="110" height="75" rx="14" fill="rgba(255,255,255,0.09)"/>
  <rect x="950" y="180" width="125" height="85" rx="16" fill="rgba(255,255,255,0.11)"/>
  <rect x="1150" y="220" width="105" height="65" rx="13" fill="rgba(255,255,255,0.07)"/>
  <rect x="1350" y="140" width="115" height="80" rx="17" fill="rgba(255,255,255,0.13)"/>
  <rect x="1550" y="280" width="120" height="70" rx="15" fill="rgba(255,255,255,0.06)"/>
  <rect x="1750" y="160" width="100" height="90" rx="19" fill="rgba(255,255,255,0.14)"/>
</svg>





