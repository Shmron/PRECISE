<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="africaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#059669;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- African continent outline -->
  <path d="M 50 80 Q 60 60 80 70 Q 100 50 120 60 Q 140 40 160 50 Q 180 30 200 40 Q 220 20 240 30 Q 260 10 280 20 Q 300 5 320 15 Q 340 10 350 30 Q 360 50 355 70 Q 350 90 340 110 Q 330 130 320 150 Q 310 170 300 190 Q 290 210 280 230 Q 270 250 260 270 Q 250 280 240 275 Q 230 270 220 260 Q 210 250 200 240 Q 190 230 180 220 Q 170 210 160 200 Q 150 190 140 180 Q 130 170 120 160 Q 110 150 100 140 Q 90 130 80 120 Q 70 110 60 100 Q 50 90 50 80 Z" 
        fill="url(#africaGradient)" stroke="#059669" stroke-width="2"/>
  
  <!-- Health facilities markers -->
  <circle cx="100" cy="120" r="8" fill="#ef4444"/>
  <circle cx="150" cy="100" r="8" fill="#ef4444"/>
  <circle cx="200" cy="130" r="8" fill="#ef4444"/>
  <circle cx="250" cy="110" r="8" fill="#ef4444"/>
  <circle cx="300" cy="140" r="8" fill="#ef4444"/>
  
  <!-- Research data points -->
  <circle cx="120" cy="150" r="4" fill="#3b82f6" opacity="0.7"/>
  <circle cx="180" cy="160" r="4" fill="#3b82f6" opacity="0.7"/>
  <circle cx="220" cy="180" r="4" fill="#3b82f6" opacity="0.7"/>
  <circle cx="280" cy="170" r="4" fill="#3b82f6" opacity="0.7"/>
  
  <!-- Connection lines -->
  <path d="M 100 120 L 150 100 L 200 130 L 250 110 L 300 140" stroke="#ef4444" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#374151">Health Research Across Africa</text>
  
  <!-- Legend -->
  <circle cx="50" cy="250" r="6" fill="#ef4444"/>
  <text x="65" y="255" font-family="Arial, sans-serif" font-size="12" fill="#374151">Health Facilities</text>
  
  <circle cx="200" cy="250" r="4" fill="#3b82f6"/>
  <text x="215" y="255" font-family="Arial, sans-serif" font-size="12" fill="#374151">Research Data Points</text>
</svg>





