<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="groundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="treeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="400" height="200" fill="url(#skyGradient)"/>
  
  <!-- Ground -->
  <rect x="0" y="200" width="400" height="100" fill="url(#groundGradient)"/>
  
  <!-- Mountains in background -->
  <path d="M 0 200 L 50 150 L 100 180 L 150 120 L 200 160 L 250 100 L 300 140 L 350 110 L 400 150 L 400 200 Z" fill="#9ca3af" opacity="0.6"/>
  
  <!-- Acacia trees -->
  <ellipse cx="80" cy="180" rx="25" ry="40" fill="url(#treeGradient)"/>
  <rect x="75" y="180" width="10" height="20" fill="#8b5cf6"/>
  
  <ellipse cx="150" cy="170" rx="20" ry="35" fill="url(#treeGradient)"/>
  <rect x="145" y="170" width="10" height="20" fill="#8b5cf6"/>
  
  <ellipse cx="250" cy="175" rx="22" ry="38" fill="url(#treeGradient)"/>
  <rect x="245" y="175" width="10" height="20" fill="#8b5cf6"/>
  
  <ellipse cx="320" cy="165" rx="18" ry="32" fill="url(#treeGradient)"/>
  <rect x="315" y="165" width="10" height="20" fill="#8b5cf6"/>
  
  <!-- Sun -->
  <circle cx="350" cy="50" r="25" fill="#fbbf24"/>
  
  <!-- Research facility in distance -->
  <rect x="50" y="160" width="60" height="40" fill="#374151" opacity="0.8"/>
  <rect x="55" y="165" width="50" height="30" fill="#10b981" opacity="0.6"/>
  
  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#374151">African Research Landscape</text>
  
  <!-- Subtitle -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Connecting Health and Environment</text>
</svg>





